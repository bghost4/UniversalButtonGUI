plugins {
    id 'java'
    id 'org.beryx.runtime' version '1.12.4'
    id 'org.openjfx.javafxplugin' version '0.0.10'
}

group 'com.derpderphurr.universalbutton'
version '1.0-SNAPSHOT'

targetCompatibility = JavaVersion.VERSION_17
sourceCompatibility = JavaVersion.VERSION_17

application {
    mainClass = "com.derpderphurr.button.ui.Launcher"
    applicationName = "Unversal Button Control"
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages','--bind-services']
    modules = [
            'java.desktop',
            'java.xml',
            'java.logging',
            'java.sql',
            'java.naming',
            'java.compiler',
            'java.scripting',
            'java.management',
            'java.datatransfer',
            'java.security.sasl',
            'jdk.unsupported',
            'jdk.jfr']
}

javafx {
    modules = [ 'javafx.controls','javafx.swing', 'javafx.fxml' ]
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation 'com.fazecast:jSerialComm:2.10.4'

}

test {
    useJUnitPlatform()
}